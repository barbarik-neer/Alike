{% extends "base.html" %}
{% block title %}{{ name }}{% endblock %}
{% block content %}
<div class="container error-page">
  <h1>{{ code }}</h1>
  <h2>{{ name }}</h2>
  <p>{% if code == 404 %}That page or analysis doesn't exist (it may have been removed).{% else %}{{ message }}{% endif %}</p>
  <a class="btn btn-primary" href="{{ url_for('home') }}">Back to home</a>
</div>
{% endblock %}
